<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: monospace; font-size: 12px; }
  #frame-wrap { position: absolute; left: -10000px; top: 0; }
</style>
<title>QA-RUNNING</title>
</head>
<body>
<div id="frame-wrap"></div>
<pre id="out">starting…</pre>
<script>
(async function () {
  'use strict';
  const P = '/CODE/HTML/';
  const results = [];
  let pass = 0, fail = 0;

  function check(name, ok, detail) {
    results.push({ name: name, ok: !!ok, detail: detail === undefined ? '' : String(detail) });
    if (ok) { pass++; } else { fail++; }
  }

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function clearStorage() {
    try { localStorage.clear(); } catch (e) {}
  }
  function primeStorage(session, seed) {
    clearStorage();
    try {
      /* Pin the MOCK transport. bb-api.js is REAL by default since B7 (the app
         talks to the Spring backend); this suite runs on the plain static
         server, which answers /api/ with 404, so it asks for the documented
         override instead. Section 22 asserts that override still exists. */
      localStorage.setItem('bb_force_mock', '1');
      if (session) localStorage.setItem('bb_session', JSON.stringify(session));
      if (seed) seed(); /* runs BEFORE the iframe loads — pages see these records */
    } catch (e) {}
  }

  function loadPath(path) {
    return new Promise((resolve) => {
      const f = document.createElement('iframe');
      f.width = 1280; f.height = 900;
      f.src = path;
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(f); } };
      f.onload = finish;
      setTimeout(finish, 4000); // never hang on a page that never fires load
      document.getElementById('frame-wrap').appendChild(f);
    });
  }

  function dumpPartial() {
    const lines = results.map(r => (r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.detail && !r.ok ? ' — ' + r.detail : ''));
    document.getElementById('out').textContent = lines.join('\n') + '\n\nTOTAL: ' + pass + ' passed, ' + fail + ' failed';
  }

  async function withPage(page, opts, fn) {
    opts = opts || {};
    try {
      primeStorage(opts.session || null, opts.seed);
      const f = await loadPath(page.charAt(0) === '/' ? page : P + page);
      await sleep(500);
      const doc = f.contentDocument, win = f.contentWindow;
      try {
        await fn({ f: f, doc: doc, win: win });
      } catch (e) {
        check(page + ' harness error', false, (e && e.message) || String(e));
      }
      f.remove();
      await sleep(30);
    } catch (e) {
      check(page + ' load error', false, (e && e.message) || String(e));
    }
    dumpPartial(); // survive interruptions — results visible even if a later section dies
  }

  const $ = (doc, s) => doc.querySelector(s);
  const $$ = (doc, s) => Array.from(doc.querySelectorAll(s));

  /* A yyyy-mm-dd date `days` from now — the required+future rules need a real
     future date, and computing it keeps the harness from rotting with the calendar. */
  const futureDate = (days) => new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);

  /* ================= 1. RENDER SMOKE — every page =================
     Role-private pages are smoke-tested twice: once under the correct
     session (must render), once logged-out (must bounce to login —
     RBAC guard). Requester pages are public on purpose. */
  const smokePublic = [
    ['landing.html', '.hero-title'],
    ['auth-login.html', '#login-form'],
    ['auth-register.html', '#to-step-2'],
    ['auth-forgot.html', '#forgot-form'],
    ['emergency-request.html', '#em-form'],
    ['about.html', '.about-hero'],
    ['contact.html', '#contact-form'],
    ['terms.html', '.legal-card'],
    ['privacy.html', '.legal-card'],
  ];
  const smokePrivate = [
    ['donor-dashboard.html', '#urgent-banner'],
    ['donor-history.html', '#history-body'],
    ['donor-profile.html', '#save-bar'],
    ['requester-search.html', '#donor-grid'],
    ['requester-request.html', '#request-form'],
    ['requester-tracking.html', '#req-list'],
    ['requester-profile.html', '#save-bar'],
    ['hospital-dashboard.html', '#inv-grid'],
    ['hospital-requests.html', '#queue-list'],
    ['hospital-profile.html', '#save-bar'],
    ['admin-dashboard.html', '#users-tbody'],
    ['admin-requests.html', '#queue-list'],
    ['admin-profile.html', '#save-bar'],
  ];
  const SMOKE_SESSION = {
    'donor-dashboard.html': { role: 'donor', name: 'Sita Gurung' },
    'donor-history.html': { role: 'donor', name: 'Sita Gurung' },
    'donor-profile.html': { role: 'donor', name: 'Sita Gurung' },
    'requester-search.html': { role: 'requester', name: 'Ramesh Shrestha' },
    'requester-request.html': { role: 'requester', name: 'Ramesh Shrestha' },
    'requester-tracking.html': { role: 'requester', name: 'Ramesh Shrestha' },
    'requester-profile.html': { role: 'requester', name: 'Ramesh Shrestha' },
    'hospital-dashboard.html': { role: 'hospital', name: 'Bir Hospital' },
    'hospital-requests.html': { role: 'hospital', name: 'Bir Hospital' },
    'hospital-profile.html': { role: 'hospital', name: 'Bir Hospital' },
    'admin-dashboard.html': { role: 'admin', name: 'Admin' },
    'admin-requests.html': { role: 'admin', name: 'Admin' },
    'admin-profile.html': { role: 'admin', name: 'Admin' },
  };
  for (const [page, sel] of smokePublic) {
    await withPage(page, {}, ({ doc }) => {
      check(page + ' renders (' + sel + ')', !!$(doc, sel));
      check(page + ' navbar + footer present', !!$(doc, '#nav-links') && !!$(doc, '.footer'));
    });
  }
  for (const [page, sel] of smokePrivate) {
    await withPage(page, { session: SMOKE_SESSION[page] }, ({ doc }) => {
      check(page + ' renders with the right role (' + sel + ')', !!$(doc, sel));
      check(page + ' navbar + footer present', !!$(doc, '#nav-links') && !!$(doc, '.footer'));
    });
    await withPage(page, {}, ({ doc }) => {
      check(page + ' (logged out) bounces to login (RBAC guard)', /auth-login\.html/.test(doc.location.href),
        doc.location.href);
    });
  }

  /* ============ 2. LANDING FOOTER LINKS WIRED + EMERGENCY CTAs ============ */
  await withPage('landing.html', {}, ({ doc }) => {
    const hrefs = $$(doc, '.footer a').map(a => a.getAttribute('href'));
    check('landing: footer About → about.html', hrefs.indexOf('about.html') > -1, hrefs.join(','));
    check('landing: footer Contact → contact.html', hrefs.indexOf('contact.html') > -1, hrefs.join(','));
    const ghost = $(doc, '.hero-btns .btn-ghost');
    check('landing: "Find blood now" goes to the public emergency flow (guests)',
      !!ghost && ghost.getAttribute('href') === 'emergency-request.html' && ghost.getAttribute('data-em') === 'find',
      ghost ? ghost.getAttribute('href') : 'missing');
    const ctaReq = $(doc, '.cta-btn-outline');
    check('landing: "Request blood" CTA goes to the emergency flow (guests)',
      !!ctaReq && ctaReq.getAttribute('href') === 'emergency-request.html', ctaReq ? ctaReq.getAttribute('href') : 'missing');
    const reqCard = $(doc, 'a[data-bb-return="requester-search.html"]');
    check('landing: "Open requester portal" locked behind login for guests',
      !!reqCard && reqCard.getAttribute('href') === 'auth-login.html', reqCard ? reqCard.getAttribute('href') : 'not rewired');
  });

  /* ============ 3. STORE BUG REGRESSION (fresh browser seeds) ============ */
  await withPage('admin-requests.html', { session: { role: 'admin', name: 'Admin' } }, ({ doc }) => {
    const cards = $$(doc, '#queue-list .req-card');
    check('admin-requests: fresh-store queue renders (status fallback fix)', cards.length >= 5, cards.length + ' cards');
    const matched = cards.find(c => c.textContent.indexOf('BB-8F3K2M') > -1);
    check('admin-requests: Matched seed shows a status label', !!matched && !!matched.querySelector('.rc-status'),
      matched ? matched.querySelector('.rc-status').textContent.trim() : 'card missing');
  });

  await withPage('hospital-requests.html', { session: { role: 'hospital', name: 'Bir Hospital' } }, ({ doc, win }) => {
    const cards = $$(doc, '#queue-list .req-card');
    check('hospital-requests: fresh-store queue renders (status fallback fix)', cards.length >= 4, cards.length + ' cards');
    const matched = cards.find(c => c.textContent.indexOf('BB-8F3K2M') > -1);
    check('hospital-requests: Matched seed shows a status label', !!matched && !!matched.querySelector('.rc-status'),
      matched ? matched.querySelector('.rc-status').textContent.trim() : 'card missing');
  });

  /* Emergency badge — seed a guest EM request BEFORE the page loads */
  await withPage('hospital-requests.html', {
    session: { role: 'hospital', name: 'Bir Hospital' },
    seed: () => {
      const reqs = JSON.parse(localStorage.getItem('bb_db.requests') || '[]');
      reqs.unshift({ id: 'EM-QA1', blood: 'B-', units: '2', urgency: 'Urgent', requester: 'Guest (emergency)', hospital: 'Bir Hospital, Kathmandu', district: 'Lalitpur', created: new Date().toISOString(), neededBy: '2026-09-20', status: 'Pending', notes: '' });
      localStorage.setItem('bb_db.requests', JSON.stringify(reqs));
    }
  }, ({ doc }) => {
    const em = $$(doc, '.req-card').find(c => c.textContent.indexOf('EM-QA1') > -1);
    check('hospital-requests: guest EM request carries the Emergency badge', !!em && !!em.querySelector('.em-tag'),
      em ? (em.querySelector('.em-tag') ? 'tagged' : 'no tag') : 'card missing');
    const member = $$(doc, '.req-card').find(c => c.textContent.indexOf('REQ-501') > -1);
    check('hospital-requests: member request has no Emergency badge', !!member && !member.querySelector('.em-tag'));
  });

  /* ============ 4. SESSION-AWARE NAV (role links rebuilt on every page) ============ */
  await withPage('landing.html', { session: { role: 'donor', name: 'Sita Gurung' } }, ({ doc }) => {
    const chip = $(doc, '.nav-user-chip .nav-user-label');
    check('landing: session chip shows name', !!chip && chip.textContent === 'Sita Gurung', chip ? chip.textContent : 'no chip');
    const portal = $$(doc, '.nav-links a').find(a => a.getAttribute('href') === 'donor-dashboard.html');
    check('landing: donor portal links injected into nav', !!portal && portal.textContent === 'Donor Portal',
      portal ? portal.textContent : 'no portal link');
    const profile = $$(doc, '.nav-links a').find(a => a.getAttribute('href') === 'donor-profile.html');
    check('landing: My Profile link present while logged in', !!profile);
    const marketing = $$(doc, '.nav-links a').filter(a => /how-it-works|#roles/.test(a.getAttribute('href') || ''));
    check('landing: marketing links replaced while logged in', marketing.length === 0, marketing.map(a => a.getAttribute('href')).join(','));
    const login = $(doc, '#nav-actions a[href="auth-login.html"]');
    check('landing: auth buttons replaced by chip', !login);
    const chipLink = $(doc, 'a.nav-user-chip');
    check('landing: profile chip is a link to donor profile',
      !!chipLink && chipLink.getAttribute('href') === 'donor-profile.html',
      chipLink ? chipLink.getAttribute('href') : 'chip not a link');
  });

  /* ============ 4b. PUBLIC PAGE + SESSION — portal links persist (About regression) ============ */
  await withPage('about.html', { session: { role: 'donor', name: 'Sita Gurung' } }, ({ doc }) => {
    const portal = $$(doc, '.nav-links a').find(a => a.getAttribute('href') === 'donor-dashboard.html');
    check('about: donor portal link present while logged in', !!portal, portal ? portal.textContent : 'missing');
    const profile = $$(doc, '.nav-links a').find(a => a.getAttribute('href') === 'donor-profile.html');
    check('about: My Profile link present while logged in', !!profile);
    const about = $(doc, '.nav-links a[href="about.html"]');
    check('about: About link kept and still active', !!about && about.classList.contains('active'),
      about ? 'active=' + about.classList.contains('active') : 'About link missing');
    const marketing = $$(doc, '.nav-links a').filter(a => /how-it-works|#roles/.test(a.getAttribute('href') || ''));
    check('about: generic marketing links replaced while logged in', marketing.length === 0, marketing.map(a => a.getAttribute('href')).join(','));

    /* In-page CTAs must not offer registration to a logged-in donor */
    const reg = $(doc, '.cta-btn-white');
    check('about: donor no longer sees "Register as donor" CTA',
      !!reg && reg.getAttribute('href') === 'donor-dashboard.html' && reg.textContent === 'Go to Donor Portal',
      reg ? reg.getAttribute('href') + ' / ' + reg.textContent : 'CTA missing');
    const req = $(doc, '.cta-btn-outline');
    check('about: donor no longer sees the "Request blood" CTA (requester-only action)',
      !req, req ? 'still present: ' + req.getAttribute('href') : 'removed');
    const bandBtns = $$(doc, '.cta-btns a');
    check('about: donor CTA band keeps only the portal button', bandBtns.length === 1 && bandBtns[0].textContent === 'Go to Donor Portal',
      bandBtns.map(b => b.textContent).join(',') || 'empty');
    const navReg = $(doc, '#nav-actions a[href="auth-register.html"]');
    check('about: navbar Register replaced by chip', !navReg);
  });

  /* ============ 4c. REQUESTER SESSION — role-specific links on public page ============ */
  await withPage('contact.html', { session: { role: 'requester', name: 'Ramesh Shrestha' } }, ({ doc }) => {
    const search = $$(doc, '.nav-links a').find(a => a.getAttribute('href') === 'requester-search.html');
    const tracking = $$(doc, '.nav-links a').find(a => a.getAttribute('href') === 'requester-tracking.html');
    check('contact: requester links injected while logged in', !!search && !!tracking,
      search ? (tracking ? 'ok' : 'tracking missing') : 'search missing');
    const contact = $(doc, '.nav-links a[href="contact.html"]');
    check('contact: Contact link kept and still active', !!contact && contact.classList.contains('active'));
    const chipLink = $(doc, 'a.nav-user-chip');
    check('contact: requester chip links to the requester profile',
      !!chipLink && chipLink.getAttribute('href') === 'requester-profile.html',
      chipLink ? chipLink.getAttribute('href') : 'chip not a link');
  });

  /* ============ 4c2. REQUESTER SESSION — member CTA destinations ============ */
  await withPage('landing.html', { session: { role: 'requester', name: 'Ramesh Shrestha' } }, ({ doc }) => {
    const req = $(doc, '.cta-btn-outline');
    check('landing (requester session): "Request blood" CTA becomes the member request form',
      !!req && req.getAttribute('href') === 'requester-request.html', req ? req.getAttribute('href') : 'missing');
    const ghost = $(doc, '.hero-btns .btn-ghost');
    check('landing (requester session): "Find blood now" becomes the donor search',
      !!ghost && ghost.getAttribute('href') === 'requester-search.html', ghost ? ghost.getAttribute('href') : 'missing');
  });

  /* ============ 4d. LANDING CTAs STAY MARKETING WHEN LOGGED OUT ============ */
  await withPage('landing.html', {}, ({ doc }) => {
    const hero = $(doc, '.hero-btns .btn-primary');
    check('landing (logged out): hero CTA still "Register as donor" → register',
      !!hero && hero.getAttribute('href') === 'auth-register.html?role=donor', hero ? hero.getAttribute('href') : 'missing');
    const bottom = $(doc, '.cta-btn-white');
    check('landing (logged out): bottom CTA still register',
      !!bottom && bottom.getAttribute('href') === 'auth-register.html?role=donor', bottom ? bottom.getAttribute('href') : 'missing');
  });

  /* ============ 4e. SESSION-AWARE QUICK-SEARCH NUDGE ============ */
  await withPage('landing.html', { session: { role: 'requester', name: 'Ramesh Shrestha' } }, async ({ doc, win }) => {
    $(doc, '#blood-group').value = 'O-';
    $(doc, '#district').value = 'Kathmandu';
    $(doc, '#search-btn').click();
    await sleep(50);
    const text = $(doc, '#search-result-text').textContent;
    check('landing (requester session): quick-search skips the login/register nudge',
      text.indexOf('log in') === -1 && text.indexOf('register') === -1 && text.indexOf('unrestricted') > -1,
      text.trim());
  });

  /* ============ 5. SEARCH MODAL — correct donor after filtering ============
     Filter B+ + available → cards [Arun, Sunita, Priya, Rajan, Deepa, Mina].
     Click the 3rd (Priya, filtered index 2). Pre-fix code looked up DONORS[2]
     = Bikash (B-) — so this catches the index bug. */
  await withPage('requester-search.html', { session: { role: 'requester', name: 'Ramesh Shrestha' } }, async ({ doc, win }) => {
    const selB = $(doc, '#f-blood'); selB.value = 'B+';
    const selA = $(doc, '#f-avail'); selA.value = 'available';
    $(doc, '#search-btn').click();
    await sleep(80);
    const cards = $$(doc, '.donor-card');
    check('requester-search: filtered list renders 6 cards', cards.length === 6, cards.length + ' cards');
    const card = cards[2];
    const cardName = card.querySelector('.dc-name').textContent.trim();
    const reqBtn = card.querySelector('.dc-request');
    check('requester-search: Request button on 3rd card', !!reqBtn);
    reqBtn.click();
    await sleep(60);
    const modalName = $(doc, '#m-donor-name').textContent.trim();
    check('requester-search: modal shows the CARD donor after filtering (index bug fix)', modalName === cardName,
      'card=' + cardName + ' modal=' + modalName);
    check('requester-search: modal overlay open', $(doc, '#modal-overlay').classList.contains('open'));
  });

  /* ============ 6. REQUEST SUBMIT → STORE + TRACKING REDIRECT ============ */
  await withPage('requester-request.html', { session: { role: 'requester', name: 'Ramesh Shrestha' } }, async ({ doc, win }) => {
    const sel = $(doc, '#r-blood');
    sel.value = 'O-';
    sel.dispatchEvent(new win.Event('change', { bubbles: true }));
    await sleep(60);
    check('requester-request: compat chips render for O-', $(doc, '#compat-chips').textContent.indexOf('O-') > -1,
      $(doc, '#compat-chips').textContent.trim());
    $(doc, '#compat-toggle').click();
    $(doc, '#r-notes').value = 'QA harness test';
    /* needed-by is required + must be a future date (bb-validate.js), so a
       valid value is needed for the submit to reach POST /api/requests. */
    $(doc, '#r-by').value = futureDate(7);
    $(doc, '#request-form').dispatchEvent(new win.Event('submit', { bubbles: true, cancelable: true }));
    await sleep(1400);
    let reqs = [];
    try { reqs = JSON.parse(win.localStorage.getItem('bb_db.requests') || '[]'); } catch (e) {}
    const added = reqs.find(r => r.blood === 'O-' && r.notes === 'QA harness test');
    check('requester-request: submit persists Pending request to store', !!added && added.status === 'Pending',
      added ? JSON.stringify({ status: added.status }) : 'not found');
    check('requester-request: redirects to tracking page', win.location.pathname.indexOf('requester-tracking') > -1,
      win.location.pathname);
  });

  /* ============ 7. TRACKING — seeds, detail modal, cancel ============
     "My Requests" is per-user now (GET /api/requests?requester=…), so the
     harness seeds requests owned by the logged-in requester instead of
     relying on the store's shared seeds (those belong to other people). */
  await withPage('requester-tracking.html', {
    session: { role: 'requester', name: 'Ramesh Shrestha' },
    seed: () => {
      const base = {
        requester: 'Ramesh Shrestha', hospital: 'Patan Hospital, Lalitpur', district: 'Lalitpur',
        created: new Date().toISOString(), neededBy: '2026-12-31', notes: '',
        timeline: [{ when: '2026-09-13 08:10', what: 'Request submitted — compatible donors notified' }]
      };
      localStorage.setItem('bb_db.requests', JSON.stringify([
        Object.assign({}, base, { id: 'BB-8F3K2M', blood: 'O+', units: '2', urgency: 'Urgent', status: 'Matched', donor: 'Arun Shrestha', donorAt: new Date().toISOString() }),
        Object.assign({}, base, { id: 'QA-TRK1', blood: 'B+', units: '1', urgency: 'Normal', status: 'Pending' }),
        Object.assign({}, base, { id: 'QA-TRK2', blood: 'A+', units: '3', urgency: 'High', status: 'Accepted' }),
        Object.assign({}, base, { id: 'QA-TRK3', blood: 'AB-', units: '1', urgency: 'Normal', status: 'Completed' })
      ]));
    }
  }, async ({ doc, win }) => {
    const cards = $$(doc, '#req-list .req-card');
    check('tracking: seeded requests render', cards.length >= 4, cards.length + ' cards');
    const target = cards.find(c => c.dataset.id === 'BB-8F3K2M');
    check('tracking: Matched seed card present', !!target);
    if (target) {
      target.querySelector('.rc-view').click();
      await sleep(60);
      check('tracking: detail modal opens', $(doc, '#modal-overlay').classList.contains('open'));
      check('tracking: modal shows request id', $(doc, '#m-id').textContent.trim() === 'BB-8F3K2M', $(doc, '#m-id').textContent);
      const cancelBtn = $(doc, '#modal-cancelreq');
      check('tracking: cancel visible for non-completed request', cancelBtn.style.display !== 'none');
      cancelBtn.click();
      await sleep(80);
      let r = null;
      try { r = JSON.parse(win.localStorage.getItem('bb_db.requests')).find(x => x.id === 'BB-8F3K2M'); } catch (e) {}
      check('tracking: cancel persists Cancelled status', !!r && r.status === 'Cancelled', r ? r.status : 'missing');
      check('tracking: modal closed after cancel', !$(doc, '#modal-overlay').classList.contains('open'));
    }
  });

  /* ============ 7b. SEARCH MODAL — request persists to the store ============ */
  await withPage('requester-search.html', { session: { role: 'requester', name: 'Ramesh Shrestha' } }, async ({ doc, win }) => {
    const card = $$(doc, '.donor-card').find(c => c.textContent.indexOf('Arun Shrestha') > -1);
    check('requester-search: Arun card present', !!card);
    if (!card) return;
    card.querySelector('.dc-request').click();
    await sleep(60);
    check('requester-search: request modal opens', $(doc, '#modal-overlay').classList.contains('open'));
    $(doc, '#m-notes').value = 'QA direct-to-donor request';
    $(doc, '#modal-send').click();
    await sleep(80);
    const reqs = JSON.parse(win.localStorage.getItem('bb_db.requests') || '[]');
    const added = reqs.find(r => r.notes === 'QA direct-to-donor request');
    check('requester-search: send persists a Pending request to the store', !!added && added.status === 'Pending',
      added ? JSON.stringify({ status: added.status, blood: added.blood, hospital: added.hospital }) : 'not found');
    check('requester-search: persisted request carries the donor blood group', !!added && added.blood === 'B+',
      added ? added.blood : 'n/a');
    /* the redirect hangs off POST /api/requests resolving — it must still fire */
    await sleep(1000);
    check('requester-search: redirects to tracking once the POST resolves',
      /requester-tracking\.html/.test(win.location.href), win.location.pathname);
  });

  /* ============ 8. HOSPITAL QUEUE — accept → fulfil → inventory decrement ============ */
  await withPage('hospital-requests.html', { session: { role: 'hospital', name: 'Bir Hospital' } }, async ({ doc, win }) => {
    const readStore = () => JSON.parse(win.localStorage.getItem('bb_db.requests'));
    const card = $$(doc, '.req-card').find(c => c.textContent.indexOf('REQ-501') > -1);
    check('hospital-requests: pending seed REQ-501 present', !!card);
    if (!card) return;
    const acceptBtn = card.querySelector('.qa.accept');
    check('hospital-requests: Accept button rendered', !!acceptBtn);
    acceptBtn.click();
    await sleep(80);
    let r = readStore().find(x => x.id === 'REQ-501');
    check('hospital-requests: accept persists Accepted', !!r && r.status === 'Accepted', r ? r.status : 'missing');
    const card2 = $$(doc, '.req-card').find(c => c.textContent.indexOf('REQ-501') > -1);
    const fulfil = card2.querySelector('.qa.accept');
    check('hospital-requests: Mark-fulfilled button appears after accept', !!fulfil && fulfil.textContent.indexOf('fulfilled') > -1,
      fulfil ? fulfil.textContent : 'no button');
    const invBefore = JSON.parse(win.localStorage.getItem('bb_db.inventory'))['O-'];
    fulfil.click();
    await sleep(80);
    r = readStore().find(x => x.id === 'REQ-501');
    const invAfter = JSON.parse(win.localStorage.getItem('bb_db.inventory'))['O-'];
    check('hospital-requests: fulfil persists + decrements inventory (2 units)', !!r && r.status === 'Fulfilled' && invAfter === invBefore - 2,
      'status=' + (r ? r.status : '?') + ' inv ' + invBefore + '→' + invAfter);
  });

  /* ============ 9. ADMIN MODERATION — forward to hospital ============ */

     set by primeStorage) because there is no backend behind the static server —
     resptest/real-backend-check.html covers the real path against the running
     app. What this section asserts is the invariants that make BOTH work, and
     the one that made the first real-mode run fail:

       bb-api.js shipped MOCK = true but BASE = '/api', while every path passed to
       request() ALREADY begins '/api/'. Real mode therefore asked for
       /api/api/donors/search and every call 404'd — an empty UI with no
       JavaScript error, invisible to this harness because mock mode never
       reaches the concatenation. */
  {
    /* Root-relative: this document lives at /resptest/, so a '../js/...' path
       escapes the project root and the fetch quietly returns ''. */
    const apiSrc = await fetch('/CODE/js/bb-api.js').then(r => r.text()).catch(() => '');
    check('bb-api.js is readable for the transport contract checks', apiSrc.length > 0,
      apiSrc.length + ' bytes');
    const baseMatch = apiSrc.match(/var\s+BASE\s*=\s*['"]([^'"]*)['"]/);
    const base = baseMatch ? baseMatch[1] : null;

    check('bb-api.js: BASE does not repeat the /api/ prefix already in every path',
      base !== null && !/\/api\/?$/.test(base),
      base === null ? 'could not read BASE as a string literal' : "BASE = '" + base + "'");

    /* The real invariant, tested by doing the concatenation the transport does.
       BASE is either empty (same-origin) or an absolute origin like
       'http://host:8322' — never a path prefix. Counting '/api/' occurrences
       does NOT work here: the regex scans non-overlapping, so
       '/api/api/donors/search' still reports a single match. Look for the
       doubled segment explicitly. */
    const isOrigin = base === '' || (base !== null && /^https?:\/\//.test(base));
    const sample = (base === null ? '!' : base) + '/api/donors/search';
    const doubled = /\/api\/api\//.test(sample);
    check('real-mode URL builder never produces a doubled /api/api/ path',
      base !== null && !doubled && isOrigin,
      sample + (doubled ? '  <- DOUBLED' : ''));

    /* Every declared endpoint must already be origin-relative under /api/. */
    const paths = (apiSrc.match(/request\(\s*'(?:GET|POST|PUT|PATCH|DELETE)'\s*,\s*'([^']+)'/g) || [])
      .map(s => s.replace(/.*'\s*,\s*'/, '').replace(/'$/, ''));
    const offenders = paths.filter(p => p.indexOf('/api/') !== 0);
    check('bb-api.js: every request() path begins /api/ (' + paths.length + ' endpoints)',
      paths.length > 0 && offenders.length === 0,
      offenders.length ? 'not under /api/: ' + offenders.join(', ') : 'all origin-relative');

    /* B7 turned the default around: the pages talk to the Spring backend unless
       the demo store is pinned. So the invariant is no longer "ships MOCK =
       true" — it is "ships REAL, with the mock reachable through the documented
       override", which is what this whole suite and the Python stub rely on. */
    check('bb-api.js: the mock override key exists (bb_force_mock)',
      /bb_force_mock/.test(apiSrc));
    check('bb-api.js: MOCK is the override flag, never hardcoded true',
      /var\s+MOCK\s*=\s*FORCE_MOCK\s*;/.test(apiSrc) && !/var\s+MOCK\s*=\s*true\s*;/.test(apiSrc));
    check('bb-api.js: ships the real backend path by default (FORCE_MOCK must be false unless pinned)',
      /localStorage\.getItem\('bb_force_mock'\)\s*===\s*'1'/.test(apiSrc));
  }

  /* ================= REPORT ================= */
  document.title = 'QA-DONE ' + pass + '/' + (pass + fail);
  dumpPartial();
})().catch(err => {
  results.push({ name: 'HARNESS CRASHED', ok: false, detail: (err && err.stack) || String(err) });
  document.title = 'QA-CRASHED';
  try {
    const lines = results.map(r => (r.ok ? 'PASS ' : 'FAIL ') + r.name + ' — ' + r.detail);
    document.getElementById('out').textContent = lines.join('\n');
  } catch (e2) { document.title = 'QA-CRASHED-HARD'; }
});
</script>
</body>
</html>
