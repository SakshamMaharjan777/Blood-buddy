# =============================================================================
# BloodBuddy backend configuration (CPJ119 §2.2–§2.6)
#
# Database: TiDB Cloud (MySQL-compatible serverless). TLS is REQUIRED.
# Secrets come from environment variables — never hardcode the real password
# here (this file IS submitted with the project).
#
# Where to find the values: TiDB Cloud console → your cluster → "Connect"
# dialog → copy Host, Port (4000), User (looks like xxxxx.root).
# Password: the cluster root password (resettable in Cluster settings).
# =============================================================================

# 8080 is NOT free on this machine: the EDB/PostgreSQL PEM Apache service
# ("PEMHTTPD-x64", running in session 0) owns it and answers with its own
# 404/default page, which looks like a broken app. BloodBuddy therefore runs on
# 8081; override with BB_SERVER_PORT (e.g. 8080 if PEM is ever uninstalled).
server.port=${BB_SERVER_PORT:8081}

# --- §2.3 Database: TiDB Cloud over TLS ---------------------------------------
# Env vars to set (IntelliJ: Run → Edit Configurations → Environment variables):
#   BB_DB_HOST      e.g. gateway01.ap-southeast-1.prod.aws.tidbcloud.com
#   BB_DB_PORT      4000
#   BB_DB_USER      e.g. 3Pxxxxxx.root
#   BB_DB_PASSWORD  your TiDB Cloud root password
# sslMode defaults to VERIFY_IDENTITY (TiDB Cloud mandates TLS; its certs are
# from a public CA so the JVM truststore works — verified working on this machine).
# TLS errors? try BB_DB_SSLMODE=PREFERRED (encrypts, skips identity check).
# Local XAMPP/MariaDB fallback: set BB_DB_PORT=3306 and BB_DB_SSLMODE=DISABLE.
#
# NOTE: the `bloodbuddy` schema must be created ONCE by hand in the TiDB Cloud
# SQL editor — serverless tiers do NOT support createDatabaseIfNotExist
# (the flag was removed so a missing schema fails with a clear "unknown
# database" instead of a confusing driver error):
#   CREATE DATABASE IF NOT EXISTS bloodbuddy CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://${BB_DB_HOST:localhost}:${BB_DB_PORT:4000}/bloodbuddy?sslMode=${BB_DB_SSLMODE:VERIFY_IDENTITY}&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=UTC
spring.datasource.username=${BB_DB_USER:root}
spring.datasource.password=${BB_DB_PASSWORD:}

# Small pool: TiDB Cloud serverless caps concurrent connections.
spring.datasource.hikari.maximum-pool-size=5

# Hibernate speaks TiDB natively (explicit = self-documenting; auto-detect works too)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.TiDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# --- Demo data seeder (B1) ----------------------------------------------------
# Seeds the demo scenario (users/donors/hospitals/stock/requests) on first boot;
# every write is exists-guarded so re-boots never duplicate. Set false for a
# clean database (e.g. before the real registration flow in B6).
bloodbuddy.seed=true

# --- B2 service smoke run ------------------------------------------------------
# Off by default. true → on boot, drive the service layer against the live
# database and log one PASS/FAIL line per business rule (BR-1 … BR-9), then undo
# every row it created. It is the compiler gap-checker: transactions, the BR-3
# row lock, lazy loading with open-in-view=false, FK ordering. Run it with
#   mvn -DskipTests compile spring-boot:run \
#       -Dspring-boot.run.jvmArguments="-Dbloodbuddy.smoke=true -Dspring.jpa.show-sql=false"
bloodbuddy.smoke=false

# --- §2.4 Mail: SMTP notification delivery ------------------------------------
# The app speaks plain SMTP through spring-boot-starter-mail; WHICH server it
# talks to is these variables and nothing else, so the dev inbox and the real
# §2.4 demo endpoint are the same code path. Delivery is never fire-and-forget:
# every attempt is stamped SENT/FAILED on its EMAIL_NOTIFICATION row (B4), so a
# mail server that is down is visible in the audit table instead of silent.
#
# DEFAULT (dev): Mailpit, the maintained MailHog successor, already downloaded to
# .tools/mailpit/ (gitignored, no install). Start it once:
#   .tools/mailpit/mailpit.exe --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025
# then read the captured mail at http://127.0.0.1:8025 (API: /api/v1/messages).
# Mailpit accepts every message and delivers none — nothing leaves the machine.
#
# REAL §2.4 DEMO — Gmail (all four vars, no code change):
#   BB_SMTP_HOST=smtp.gmail.com   BB_SMTP_PORT=587
#   BB_SMTP_USER=<the Gmail address>   BB_SMTP_PASSWORD=<16-char app password>
#   BB_SMTP_AUTH=true             BB_SMTP_STARTTLS=true
#   BB_MAIL_FROM=BloodBuddy <that same Gmail address>
# (Gmail rejects/rewrites a From that is not the authenticated account, and needs
#  2-Step Verification before it will issue an app password.)
# Any other SMTP relay works the same way; port 465 instead of 587 needs
# BB_SMTP_STARTTLS=false plus mail.smtp.ssl.enable=true.
spring.mail.host=${BB_SMTP_HOST:localhost}
spring.mail.port=${BB_SMTP_PORT:1025}
spring.mail.username=${BB_SMTP_USER:}
spring.mail.password=${BB_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${BB_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${BB_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# From address for outgoing BloodBuddy notifications (must match BB_SMTP_USER on Gmail)
bloodbuddy.mail.from=${BB_MAIL_FROM:BloodBuddy <no-reply@bloodbuddy.local>}

# --- B6 security --------------------------------------------------------------
# The API is session-authenticated (POST /api/auth/login sets a JSESSIONID cookie)
# and authorized per role in config/SecurityConfig; the dev actor headers of the B3
# phase are gone. CSRF is disabled there on purpose — the frontend has no token
# plumbing yet — which is stated in that file's javadoc rather than left implicit.
server.servlet.session.timeout=8h

# --- File upload limits (§2.5 photos are small; cap them anyway) -------------
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=4MB

# --- Logging -----------------------------------------------------------------
logging.level.org.hibernate.SQL=INFO
